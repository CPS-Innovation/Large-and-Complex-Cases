trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: lacc-deployment-global
  - name: buildReason
    value: $[variables['Build.Reason']]

pool: "LaCC PreProd Pool"

steps:
  - checkout: self
    persistCredentials: true

  - script: |
      set -euo pipefail

      if [[ ! "$(releaseVersion)" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "##vso[task.logissue type=error]The value of variable releaseVersion: $(releaseVersion) is not a valid semantic version. Expected format: MAJOR.MINOR.PATCH."
        exit 1
      fi

      newTag="v$(releaseVersion)"

      # get all tags from origin and sort by version (ignore annotated tags peeled references)
      latestTag=$(git ls-remote --tags origin 'refs/tags/v*' |
        awk '$2 !~ /\^\{\}$/ {sub("refs/tags/", "", $2); print $2}' |
        sort -V |
        tail -n 1)

      if [[ ! "$latestTag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "##vso[task.logissue type=error]The latest tag found in the remote repository has an unexpected format: $latestTag. Expected format: vMAJOR.MINOR.PATCH."
        exit 1
      fi

      echo "Latest tag: $latestTag"
      echo "New tag: $newTag"

      if [[ "$(printf '%s\n%s\n' "$latestTag" "$newTag" | sort -V | tail -n1)" == "$latestTag" ]]; then
        echo "##vso[task.logissue type=error]The semver value of variable releaseVersion: $(releaseVersion) must be greater than ${latestTag#v}."
        exit 1
      else
        echo "The respository will be tagged with the new release version $newTag"
        echo "##vso[task.setvariable variable=newTag;]$newTag"
      fi
    displayName: "Validate releaseVersion Tag"

  - script: |
      set -euo pipefail

      # overwrite any local tags. We are only interested in the remote:
      git tag -f $(newTag)

      git push origin refs/tags/$(newTag)
    # only tag repo on merge to main:
    condition: and(succeeded(), eq(variables.buildReason, 'IndividualCI'))
    displayName: "Tag Repository"
