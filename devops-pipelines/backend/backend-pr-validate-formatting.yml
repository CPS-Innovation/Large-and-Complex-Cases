trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*

pool: "LACC PreProd Pool"

variables:
  - name: dotNetVersion
    value: "10.0.102"

jobs:
  - job: Validate_formatting
    displayName: "Validate Dotnet Formatting"
    steps:
      - checkout: self
        clean: true

      - script: |
          if command -v pwsh &> /dev/null; then
            echo "PowerShell already installed. Skipping installation."
          else
            echo "Installing PowerShell..."
            bash '$(System.DefaultWorkingDirectory)/devops-pipelines/scripts/installPowershell.sh'
            echo "Powershel version: $(pwsh -v)"
          fi
        displayName: "Install PowerShell"

      - task: UseDotNet@2
        displayName: "Use .NET SDK"
        inputs:
          packageType: "sdk"
          version: $(dotnetVersion)

      - task: PowerShell@2
        displayName: "Validate .NET Formatting"
        inputs:
          targetType: "inline"
          workingDirectory: "$(System.DefaultWorkingDirectory)/backend"
          script: |
            $outputFile = "$(Agent.TempDirectory)\dotnet-format-output.txt"

            Write-Host "Running dotnet format..."

            # Capture both stdout and stderr.
            & dotnet format --no-restore --verify-no-changes *> $outputFile
            $formatExitCode = $LASTEXITCODE

            $lines = Get-Content $outputFile

            $issueCount = 0

            foreach ($line in $lines) {

              # Match dotnet format diagnostics such as:
              # C:\repo\src\Foo.cs(84,29): error WHITESPACE: Fix whitespace formatting. Insert '\s\s'. [C:\repo\Foo.csproj]

              if ($line -match '^(.*)\((\d+),(\d+)\):\s+error\s+([^:]+):\s+(.*?)\s+\[(.*)\]$') {

                $filePath = $matches[1]
                $lineNumber = $matches[2]
                $columnNumber = $matches[3]
                $rule = $matches[4]
                $message = $matches[5]

                # Convert absolute path to repository-relative path.
                $repoRoot = "$(Build.SourcesDirectory)"

                if ($filePath.StartsWith(
                      $repoRoot,
                      [System.StringComparison]::OrdinalIgnoreCase)) {

                  $filePath = $filePath.Substring($repoRoot.Length).TrimStart('\', '/')
                }

                # Use forward slashes for cleaner output.
                $filePath = $filePath.Replace('\', '/')

                Write-Host "##vso[task.logissue type=warning;sourcepath=$filePath;linenumber=$lineNumber;columnnumber=$columnNumber;code=$rule]$message"

                $issueCount++
              }
              elseif (-not [string]::IsNullOrWhiteSpace($line)) {
                # Preserve any output that isn't a formatting diagnostic.
                Write-Host $line
              }
            }

            Write-Host ""
            Write-Host "Found $issueCount formatting issue(s)."

            if ($formatExitCode -ne 0) {
              Write-Error "dotnet format validation failed. Run 'dotnet format' to fix the formatting issues."
              exit $formatExitCode
            }

            Write-Host "Formatting validation passed."
