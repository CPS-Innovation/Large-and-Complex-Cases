trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ui-spa/*

pr: none

variables:
  - group: lacc-deployment-global

stages:
  - template: ../templates/ui-build-and-deploy-stages.yml
    parameters:
      environment: staging
      deployToSlot: true
      slotName: "stg"

  - stage: Release_Gate
    displayName: "Release Gate"
    jobs:
      - job: Manual_Validation
        pool: server
        timeoutInMinutes: 6500
        steps:
          - task: ManualValidation@1
            displayName: Request Validation
            timeoutInMinutes: 6480
            inputs:
              notifyUsers: $(prodNotifyUsers)
              approvers: $(prodApprovers)
              allowApproversToApproveTheirOwnRuns: true
              instructions: "Approval is required to deploy to production."
              onTimeout: "reject"

  - template: ../templates/ui-build-and-deploy-stages.yml
    parameters:
      environment: prod
      agentPool: "LACC Prod Pool"
      azureSubscription: "Azure Pipeline: Large and Complex Cases - Prod"
      deployToSlot: true
      slotName: "stg"
